openapi: 3.1.0
info:
  title: Larridin Scout API
  version: v1
  summary: Enterprise AI adoption, fluency, governance, and workflow intelligence metrics.
  description: 'The Larridin Scout API exposes the metrics behind Larridin Scout: AI adoption, AI proficiency
    (fluency), AI tool inventory and policy enforcement, employee surveys, and workflow intelligence.
    All documented endpoints are read-only (GET) and return the standard Scout envelope `{ "success":
    true, "data": {...}, "query": {...} }`.


    Generated by the API Evangelist enrichment pipeline as a faithful transcription of the provider''s
    public reference at https://docs.larridin.com/api/scout-api-v1-reference. It is not a provider-published
    specification.'
  contact:
    name: Larridin
    url: https://larridin.com/contact
  termsOfService: https://larridin.com/terms-of-use
  x-generated-by: api-evangelist-enrichment-pipeline
  x-source: https://docs.larridin.com/api/scout-api-v1-reference
servers:
- url: https://scout-api.larridin.com/api/v1
  description: Production
security:
- companyApiKey: []
tags:
- name: Adoption
  description: Organization- and department-level AI adoption metrics.
- name: Proficiency
  description: AI proficiency scoring, prompt categories, and conversation metrics. Period-based selection.
- name: Tools
  description: Browser and desktop AI tool adoption, policy enforcement, and unapproved tool discovery.
- name: Surveys
  description: Survey campaigns, questions, options, and responses.
- name: Workflow Intelligence
  description: Clustered workflow analysis, friction, recommendations, and tool verdicts.
paths:
