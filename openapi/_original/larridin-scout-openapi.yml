        '500':
          $ref: '#/components/responses/ServerError'
      description: Returns organization-level or department-level AI adoption overview metrics.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
      - name: endDate
        in: query
        required: true
        schema:
          type: string
      - name: groupBy
        in: query
        required: false
        schema:
