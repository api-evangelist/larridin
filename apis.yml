aid: larridin
name: Larridin
description: Larridin is an enterprise AI intelligence platform that measures whether an organization's
  investment in AI is actually paying off across both its human and agent workforce. Its Scout product
  instruments AI usage through a managed browser extension and desktop agent, then joins that telemetry
  with source control, coding-assistant, incident, and work-tracking systems to report on AI adoption,
  AI fluency (proficiency), AI governance and shadow-tool risk, token spend, workflow intelligence, and
  Developer Intelligence — covering AI code share, velocity, quality, CI/CD delivery, reliability, agent
  effectiveness, agent readiness, and developer sentiment. Larridin exposes this data through the
  read-only Scout API v1 and a beta Model Context Protocol server for agents.
